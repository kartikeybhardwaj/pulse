[project]
name = "pulse-backend"
version = "1.0.0"
description = "Pulse backend — AWS Lambda handlers for real-time polling"
license = "MIT"
authors = [{name = "Kartikey Bhardwaj", email = "kartikey.bh21@gmail.com"}]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff>=0.15.2", "pytest>=8.0", "moto[dynamodb]>=5.1.22", "boto3>=1.35"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
