[project]
name = "pulse-backend"
version = "1.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff>=0.15.2", "pytest>=8.0", "moto[dynamodb]>=5.0", "boto3>=1.35"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
